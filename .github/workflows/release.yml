# Pushing a tag such as v0.1.0 (matching package.json) builds JAWA POS and
# JAWA.FOOD for macOS and Windows and publishes them as a GitHub release.
# The POS and FOOD landing pages link to
# https://github.com/<owner>/JAWA.APP/releases/latest/download/<file>.
#
# Repository variables (public values): JAWA_POS_ORIGIN, JAWA_FOOD_ORIGIN.
# Optional secrets for signing: MAC_CSC_LINK, MAC_CSC_KEY_PASSWORD, APPLE_ID,
# APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID, WIN_CSC_LINK, WIN_CSC_KEY_PASSWORD.
# Without them the installers are unsigned (see README).
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-latest
            platform: ""
          - os: windows-latest
            platform: "--win"
    runs-on: ${{ matrix.os }}
    env:
      JAWA_POS_ORIGIN: ${{ vars.JAWA_POS_ORIGIN }}
      JAWA_FOOD_ORIGIN: ${{ vars.JAWA_FOOD_ORIGIN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Check the tag and the production addresses
        shell: bash
        run: |
          expected="v$(node -p 'require("./package.json").version')"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then echo "::error::Tag $GITHUB_REF_NAME does not match package.json ($expected)"; exit 1; fi
          if [ -z "$JAWA_POS_ORIGIN" ] || [ -z "$JAWA_FOOD_ORIGIN" ]; then echo "::error::Set the repository variables JAWA_POS_ORIGIN and JAWA_FOOD_ORIGIN"; exit 1; fi
      - run: npm ci
      - run: npm test
      - name: Build JAWA POS and JAWA.FOOD
        shell: bash
        env:
          CSC_LINK: ${{ matrix.os == 'macos-latest' && secrets.MAC_CSC_LINK || secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ matrix.os == 'macos-latest' && secrets.MAC_CSC_KEY_PASSWORD || secrets.WIN_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          signing=""
          if [ -z "$CSC_LINK" ]; then
            signing="--unsigned"
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            unset CSC_LINK CSC_KEY_PASSWORD
          fi
          for app in pos food; do node scripts/build.js "$app" $PLATFORM $signing; done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installers-${{ runner.os }}
          path: |
            dist/*/JAWA-*-mac.dmg
            dist/*/JAWA-*-mac.zip
            dist/*/JAWA-*-windows.exe
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: installers
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "JAWA desktop apps $GITHUB_REF_NAME" --generate-notes \
            installers/*/JAWA-*
